name: "Set up Java and Gradle"

runs:
    using: composite
    steps:
        -   name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
                distribution: "temurin"
                java-version: 21
                cache: gradle

        -   name: Set up Gradle
            uses: gradle/actions/setup-gradle@v4
            with:
                cache-read-only: false
                cache-overwrite-existing: true
                cache-cleanup: always
