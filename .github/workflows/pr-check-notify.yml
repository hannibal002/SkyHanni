name: "PR Changelog Notify"

on:
    workflow_run:
        workflows: ["PR Changelog Verification"]
        types: [completed]

permissions:
    pull-requests: write
    issues: write
    actions: read

jobs:
    notify:
        if: github.event.workflow_run.event == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   name: Download artifact
                id: download
                uses: actions/github-script@v7
                with:
                    script: |
                        const arts = await github.rest.actions.listWorkflowRunArtifacts({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            run_id: context.payload.workflow_run.id,
                        });
                        const match = arts.data.artifacts.find(a => a.name === 'pr-check-output');
                        if (!match) {
                            core.warning('No pr-check-output artifact found — skipping');
                            return;
                        }
                        const dl = await github.rest.actions.downloadArtifact({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            artifact_id: match.id,
                            archive_format: 'zip',
                        });
                        require('fs').writeFileSync('artifact.zip', Buffer.from(dl.data));
                        core.setOutput('found', 'true');

            -   name: Unzip artifact
                if: steps.download.outputs.found == 'true'
                run: unzip -q artifact.zip -d artifact

            -   name: Validate and post comment / manage label
                if: steps.download.outputs.found == 'true'
                uses: actions/github-script@v7
                with:
                    script: |
                        const fs = require('fs');
                        if (!fs.existsSync('artifact/pr_number.txt')) {
                            core.warning('Artifact missing expected files — skipping');
                            return;
                        }

                        const prNumber = parseInt(fs.readFileSync('artifact/pr_number.txt', 'utf8').trim(), 10);
                        const prHeadSha = fs.readFileSync('artifact/pr_head_sha.txt', 'utf8').trim();
                        const outcome   = fs.readFileSync('artifact/outcome.txt',    'utf8').trim();

                        // Prevent a crafted artifact from targeting a different PR
                        if (prHeadSha !== context.payload.workflow_run.head_sha) {
                            core.setFailed(`head_sha mismatch: artifact=${prHeadSha} workflow_run=${context.payload.workflow_run.head_sha}`);
                            return;
                        }

                        const base  = { owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber };
                        const label = 'Wrong Title/Changelog';

                        if (outcome === 'failure') {
                            await github.rest.issues.addLabels({ ...base, labels: [label] })
                                .catch(e => core.warning(`addLabels: ${e.message}`));
                            if (fs.existsSync('artifact/changelog_errors.txt')) {
                                const body = fs.readFileSync('artifact/changelog_errors.txt', 'utf8');
                                await github.rest.issues.createComment({ ...base, body });
                            }
                        } else {
                            await github.rest.issues.removeLabel({ ...base, name: label })
                                .catch(e => { if (e.status !== 404) core.warning(`removeLabel: ${e.message}`); });
                        }
