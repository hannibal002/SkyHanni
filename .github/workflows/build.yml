# Execution context: PR branch code
name: Build

on:
    push:
        branches:
            - "**"
        paths-ignore:
            - ".gitignore"
    pull_request:
        branches:
            - "**"
        paths-ignore:
            - ".gitignore"
    workflow_dispatch: { }

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        name: Build and test
        strategy:
            fail-fast: false
            matrix:
                minecraft_version:
                    - "26.1"
                    - "26.2"
                    - "26.3"
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   uses: ./.github/actions/setup-normal-workspace
            -   name: Build with Gradle w/retry
                id: assemble
                continue-on-error: true
                uses: ./.github/actions/gradle-retry
                with:
                    gradle-command: ${{ matrix.minecraft_version }}:assemble -x ${{ matrix.minecraft_version }}:test --stacktrace
            -   name: Save assemble log on failure
                if: steps.assemble.outcome == 'failure'
                run: |
                    cp "$GITHUB_WORKSPACE/gradle-output.log" \
                       "assemble-failure-${{ matrix.minecraft_version }}.log" 2>/dev/null || true
            -   name: Upload assemble failure artifact
                if: steps.assemble.outcome == 'failure'
                uses: actions/upload-artifact@v7
                with:
                    name: build-failure-output-${{ matrix.minecraft_version }}
                    path: assemble-failure-${{ matrix.minecraft_version }}.log
                    if-no-files-found: warn
            -   name: Upload development build
                uses: actions/upload-artifact@v7
                with:
                    path: build/libs/SkyHanni-*-mc${{ matrix.minecraft_version }}.jar
                    archive: false
            # Skipped after a failed assemble: the test failure would only be a follow-up, and two logs under
            # one artifact name would be read back in directory order.
            -   name: Test with Gradle w/retry
                id: test
                if: steps.assemble.outcome == 'success'
                continue-on-error: true
                uses: ./.github/actions/gradle-retry
                with:
                    gradle-command: ${{ matrix.minecraft_version }}:test
            # Same artifact name as the assemble failure above, only one of the two can ever be produced.
            -   name: Save test log on failure
                if: steps.test.outcome == 'failure'
                run: |
                    cp "$GITHUB_WORKSPACE/gradle-output.log" \
                       "test-failure-${{ matrix.minecraft_version }}.log" 2>/dev/null || true
            -   name: Upload test failure artifact
                if: steps.test.outcome == 'failure'
                uses: actions/upload-artifact@v7
                with:
                    name: build-failure-output-${{ matrix.minecraft_version }}
                    path: test-failure-${{ matrix.minecraft_version }}.log
                    if-no-files-found: warn
            -   name: Upload test report
                uses: actions/upload-artifact@v7
                if: ${{ !cancelled() }}
                with:
                    name: Test Results (${{ matrix.minecraft_version }})
                    path: versions/${{ matrix.minecraft_version }}/build/reports/tests/test/
                    if-no-files-found: warn
            # Assemble and test are both continue-on-error, so this step is what makes either of them red.
            # A newly added continue-on-error step has to be listed here too.
            -   name: Fail job if assemble or test failed
                if: steps.assemble.outcome == 'failure' || steps.test.outcome == 'failure'
                run: exit 1

    verify:
        runs-on: ubuntu-latest
        name: Verify build results
        needs: build
        if: ${{ always() && !cancelled() && !contains(needs.*.result, 'cancelled') }}
        steps:
            -   name: Check matrix result
                env:
                    REQUIRED_JOBS: ${{ toJSON(needs) }}
                run: |
                    python3 <<'PY'
                    import json
                    import os
                    import sys

                    jobs = json.loads(os.environ["REQUIRED_JOBS"])
                    failed_jobs = []

                    for name, job in jobs.items():
                        result = job["result"]
                        print(f"{name}: {result}")
                        if result != "success":
                            failed_jobs.append((name, result))

                    for name, result in failed_jobs:
                        print(f"::error title=Required job did not succeed::{name} finished with result '{result}'")

                    sys.exit(1 if failed_jobs else 0)
                    PY
