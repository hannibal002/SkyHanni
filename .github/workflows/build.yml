name: Build

on:
    push:
        branches:
            - "*"
        paths-ignore:
            - ".gitignore"
    pull_request_target:
        branches:
            - "*"
        paths-ignore:
            - ".gitignore"
    workflow_dispatch:
permissions: write-all
jobs:
    build_and_test:
        name: "Build and test"
        runs-on: ubuntu-latest
        strategy:
            matrix:
                version:
                    - "1.8.9"
                    - "1.21.5"
                    - "1.21.7"
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   name: Set up workspace
                uses: ./.github/actions/setup-normal-workspace

            -   name: Build with Gradle w/ retry
                uses: ./.github/actions/gradle-retry
                with:
                    gradle-command: ${{ matrix.version }}:build --no-daemon --stacktrace -PskipDetekt=true

            -   name: Upload JAR
                uses: actions/upload-artifact@v4
                if: ${{ !cancelled() }}
                with:
                    name: "${{ matrix.version }} Development Build"
                    path: build/libs/*.jar

            -   name: Test with Gradle w/ retry
                uses: ./.github/actions/gradle-retry
                if: ${{ matrix.version == '1.8.9' }}
                with:
                    gradle-command: ${{ matrix.version }}:test --no-daemon

            -   name: Upload test report
                uses: actions/upload-artifact@v4
                if: ${{ matrix.version == '1.8.9' && !cancelled() }}
                with:
                    name: "Test Results"
                    path: versions/1.8.9/build/reports/tests/test/
