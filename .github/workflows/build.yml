name: Build

on:
    push:
        branches:
            - "*"
        paths-ignore:
            - ".gitignore"
    pull_request_target:
        branches:
            - "*"
        paths-ignore:
            - ".gitignore"
    workflow_dispatch:
permissions: write-all
jobs:
    build:
        runs-on: ubuntu-latest
        name: "Build and test"
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   uses: hannibal002/SkyHanni/.github/actions/setup-normal-workspace@beta
                if: github.repository == 'hannibal002/SkyHanni'
            -   uses: ./.github/actions/setup-normal-workspace
                if: github.repository != 'hannibal002/SkyHanni'
            -   name: Disable preprocessor
                run: |
                    mkdir -p .gradle
                    echo skyhanni.multi-version=off > .gradle/private.properties
            -   name: Build with Gradle w/retry
                if: github.repository == 'hannibal002/SkyHanni'
                uses: hannibal002/SkyHanni/.github/actions/gradle-retry@beta
                with:
                    gradle-command: assemble -x test --stacktrace -PskipDetekt=true
            -   name: Build with Gradle w/retry
                if: github.repository != 'hannibal002/SkyHanni'
                uses: ./.github/actions/gradle-retry
                with:
                    gradle-command: assemble -x test --stacktrace -PskipDetekt=true
            -   name: Save Gradle build cache
                uses: actions/cache/save@v4
                with:
                    path: ~/.gradle/caches/build-cache-1
                    key: gradle-build-cache-${{ github.run_id }}-${{ github.run_attempt }}
            -   uses: actions/upload-artifact@v7
                name: Upload development build
                with:
                    name: "Development Build"
                    path: build/libs/*.jar
            -   name: Test with Gradle w/retry
                if: github.repository == 'hannibal002/SkyHanni'
                uses: hannibal002/SkyHanni/.github/actions/gradle-retry@beta
                with:
                    gradle-command: test
            -   name: Test with Gradle w/retry
                if: github.repository != 'hannibal002/SkyHanni'
                uses: ./.github/actions/gradle-retry
                with:
                    gradle-command: test
            -   uses: actions/upload-artifact@v7
                name: "Upload test report"
                if: ${{ !cancelled() }}
                with:
                    name: "Test Results"
                    path: versions/*/build/reports/tests/test/
                    if-no-files-found: warn

    preprocess:
        runs-on: ubuntu-latest
        name: "Build multi version"
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   uses: hannibal002/SkyHanni/.github/actions/setup-normal-workspace@beta
                if: github.repository == 'hannibal002/SkyHanni'
            -   uses: ./.github/actions/setup-normal-workspace
                if: github.repository != 'hannibal002/SkyHanni'
            -   name: Enable preprocessor
                run: |
                    mkdir -p .gradle
                    echo skyhanni.multi-version=compile > .gradle/private.properties
            -   name: Build with Gradle w/retry
                if: github.repository == 'hannibal002/SkyHanni'
                uses: hannibal002/SkyHanni/.github/actions/gradle-retry@beta
                with:
                    gradle-command: build --stacktrace -PskipDetekt=true
            -   name: Build with Gradle w/retry
                if: github.repository != 'hannibal002/SkyHanni'
                uses: ./.github/actions/gradle-retry
                with:
                    gradle-command: build --stacktrace -PskipDetekt=true

            -   name: Add label if build fails
                if: ${{ failure() && github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open' }}
                uses: actions-ecosystem/action-add-labels@v1
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    labels: 'Fails Multi-Version'

            -   name: Remove label if build passes
                if: ${{ success() && github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open' }}
                continue-on-error: true
                uses: actions-ecosystem/action-remove-labels@v1
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    labels: 'Fails Multi-Version'

            -   name: Upload multi-version build
                uses: actions/upload-artifact@v7
                if: ${{ !cancelled() }}
                with:
                    name: "Multi-version Development Build"
                    path: build/libs/*.jar

    detekt:
        name: Run detekt
        runs-on: ubuntu-latest
        needs: [build]
        if: |
            github.event_name == 'pull_request_target' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/beta')
        concurrency:
            group: detekt-${{ github.event.pull_request.number || github.sha }}
            cancel-in-progress: true
        outputs:
            sarif_exists: ${{ steps.check_sarif.outputs.exists }}
            detekt_failed: ${{ steps.run_detekt.outcome == 'failure' || steps.run_detekt_fork.outcome == 'failure' }}
        steps:
            -   name: Checkout PR code
                if: github.event_name == 'pull_request_target'
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}
            -   name: Checkout code
                if: github.event_name != 'pull_request_target'
                uses: actions/checkout@v6

            -   uses: hannibal002/SkyHanni/.github/actions/setup-normal-workspace@beta
                if: github.repository == 'hannibal002/SkyHanni'
            -   uses: ./.github/actions/setup-normal-workspace
                if: github.repository != 'hannibal002/SkyHanni'
            -   name: Restore Gradle build cache from build job
                uses: actions/cache/restore@v4
                with:
                    path: ~/.gradle/caches/build-cache-1
                    key: gradle-build-cache-${{ github.run_id }}-${{ github.run_attempt }}
            -   name: Disable preprocessor
                run: |
                    mkdir -p .gradle
                    echo skyhanni.multi-version=off > .gradle/private.properties
            -   name: Run detekt main (w/ typing analysis) w/gradle retry
                id: run_detekt
                if: github.repository == 'hannibal002/SkyHanni'
                uses: hannibal002/SkyHanni/.github/actions/gradle-retry@beta
                continue-on-error: true
                with:
                    gradle-command: :1.21.10:detektMain --stacktrace
            -   name: Run detekt main (w/ typing analysis) w/gradle retry
                id: run_detekt_fork
                if: github.repository != 'hannibal002/SkyHanni'
                uses: ./.github/actions/gradle-retry
                continue-on-error: true
                with:
                    gradle-command: :1.21.10:detektMain --stacktrace

            -   name: Check if SARIF file exists
                if: always()
                id: check_sarif
                run: |
                    if [ -f "build/reports/detekt/main.sarif" ]; then
                        echo "exists=true" >> $GITHUB_OUTPUT
                    else
                        echo "exists=false" >> $GITHUB_OUTPUT
                    fi

            -   name: Add label if detekt fails
                if: ${{ github.event_name == 'pull_request_target' && (steps.run_detekt.outcome == 'failure' || steps.run_detekt_fork.outcome == 'failure') && steps.check_sarif.outputs.exists == 'true' }}
                uses: actions-ecosystem/action-add-labels@v1
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    labels: 'Detekt'
            -   name: Remove label if detekt passes
                if: ${{ github.event_name == 'pull_request_target' && steps.run_detekt.outcome != 'failure' && steps.run_detekt_fork.outcome != 'failure' }}
                continue-on-error: true
                uses: actions-ecosystem/action-remove-labels@v1
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    labels: 'Detekt'

            -   name: Annotate detekt failures
                if: ${{ !cancelled() && steps.check_sarif.outputs.exists == 'true' }}
                run: |
                    chmod +x .github/scripts/process_detekt_sarif.sh
                    ./.github/scripts/process_detekt_sarif.sh build/reports/detekt/main.sarif | tee detekt_output.txt
            -   name: Upload detekt output as artifact
                if: ${{ !cancelled() && steps.check_sarif.outputs.exists == 'true' }}
                uses: actions/upload-artifact@v7
                with:
                    name: detekt-output
                    path: detekt_output.txt

            -   name: Fail if detekt failed
                if: steps.run_detekt.outcome == 'failure' || steps.run_detekt_fork.outcome == 'failure'
                run: exit 1

    detekt_comment:
        name: Comment detekt failures on PR
        runs-on: ubuntu-latest
        needs: [detekt]
        if: |
            always() &&
            needs.detekt.outputs.sarif_exists == 'true' &&
            needs.detekt.outputs.detekt_failed == 'true' &&
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.draft == false
        concurrency:
            group: detekt-comment-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        steps:
            -   name: Checkout PR code
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.event.pull_request.head.sha }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}
            -   name: Download detekt output
                uses: actions/download-artifact@v8
                with:
                    name: detekt-output
                    path: .
            -   name: Process detekt output and create comment
                env:
                    PR_SHA: ${{ github.event.pull_request.head.sha }}
                    GITHUB_REPOSITORY: ${{ github.repository }}
                run: |
                    kotlinc -script .github/scripts/process-detekt-output.kts
            -   name: Check for duplicate comment
                id: check_duplicate
                uses: actions/github-script@v7
                with:
                    script: |
                        const fs = require('fs');
                        const commentBody = fs.readFileSync('detekt_comment.txt', 'utf8');
                        const m = commentBody.match(/<!--\s*detekt-sarif-hash:(-?\d+)\s*-->/);
                        if (!m) return false;
                        const hash = m[1];
                        const { data: comments } = await github.rest.issues.listComments({
                            owner: context.repo.owner,
                            repo:  context.repo.repo,
                            issue_number: context.issue.number
                        });
                        return comments.some(c => c.body.includes(hash));
            -   name: Skip comment if duplicate
                if: steps.check_duplicate.outputs.result == 'true'
                run: echo "Duplicate comment found, skipping..."
            -   name: Add comment to PR
                if: steps.check_duplicate.outputs.result != 'true'
                uses: actions/github-script@v7
                with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    script: |
                        const fs = require('fs');
                        const commentBody = fs.readFileSync('detekt_comment.txt', 'utf8');
                        github.rest.issues.createComment({
                            issue_number: context.issue.number,
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            body: commentBody
                        })
