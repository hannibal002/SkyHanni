name: Build and test

on:
    push:
        branches:
            - "*"
        paths-ignore:
            - ".gitignore"
    pull_request_target:
        branches:
            - "*"
        paths-ignore:
            - ".gitignore"
    workflow_dispatch:
permissions: write-all
jobs:
    build-1.8.9:
        name: "Build 1.8.9"
        runs-on: ubuntu-latest
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   name: Build
                uses: ./.github/actions/build
                with:
                    mc_version: "1.8.9"

    test-1.8.9:
        name: "Test 1.8.9"
        runs-on: ubuntu-latest
        needs: build-1.8.9
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   name: Set up workspace
                uses: ./.github/actions/setup-normal-workspace

            -   name: Test with Gradle w/ retry
                uses: ./.github/actions/gradle-retry
                with:
                    gradle-command: 1.8.9:test --no-daemon

            -   name: Upload test report
                uses: actions/upload-artifact@v4
                if: ${{ !cancelled() }}
                with:
                    name: "Test Results"
                    path: versions/1.8.9/build/reports/tests/test/

    build-1.21.5:
        name: "Build 1.21.5"
        runs-on: ubuntu-latest
        needs: build-1.8.9
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   name: Build
                uses: ./.github/actions/build
                with:
                    mc_version: "1.21.5"

    build-1.21.7:
        name: "Build 1.21.7"
        runs-on: ubuntu-latest
        needs: build-1.21.5
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   name: Build
                uses: ./.github/actions/build
                with:
                    mc_version: "1.21.7"
