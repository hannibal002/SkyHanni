name: Label PR on Build Failure

on:
    workflow_run:
        workflows: ["Build"]
        types:
            - completed

permissions:
    pull-requests: write

jobs:
    label_when_fails:
        runs-on: ubuntu-latest
        # This job only runs for pull requests, not for pushes to branches.
        if: >
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.pull_requests[0]

        steps:
            - name: Get PR number
              id: get_pr
              run: echo "PR_NUMBER=${{ github.event.workflow_run.pull_requests[0].number }}" >> $GITHUB_OUTPUT

            - name: Add label if build failed
              if: ${{ github.event.workflow_run.conclusion == 'failure' }}
              uses: actions-ecosystem/action-add-labels@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  number: ${{ steps.get_pr.outputs.PR_NUMBER }}
                  labels: "Fails Multi-Version"

            - name: Remove label if build passed
              if: ${{ github.event.workflow_run.conclusion == 'success' }}
              uses: actions-ecosystem/action-remove-labels@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  number: ${{ steps.get_pr.outputs.PR_NUMBER }}
                  labels: "Fails Multi-Version"
