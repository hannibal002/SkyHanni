# Execution context: base branch code, called by Build workflow
name: Build Review

on:
    workflow_run:
        workflows: [ "Build" ]
        types: [ completed ]

concurrency:
    group: build-review-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: true

permissions:
    issues: write
    pull-requests: write
    actions: read
    statuses: write

jobs:
    verify:
        name: Publish build status
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion != 'cancelled'
        steps:
            -   name: Publish Verify build results status
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                    WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
                    WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
                run: |
                    if [ "$WORKFLOW_CONCLUSION" = "success" ]; then
                        STATE="success"
                        DESCRIPTION="All build jobs succeeded"
                    else
                        STATE="failure"
                        DESCRIPTION="Build workflow finished with $WORKFLOW_CONCLUSION"
                    fi

                    gh api --method POST \
                        "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                        -f state="$STATE" \
                        -f context="Verify build results" \
                        -f description="$DESCRIPTION" \
                        -f target_url="$WORKFLOW_URL"

    review:
        name: Post build failure comment
        runs-on: ubuntu-latest
        if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Download build failure artifact (1.21.11)
                id: download_1
                uses: actions/download-artifact@v8
                with:
                    name: build-failure-output-1.21.11
                    run-id: ${{ github.event.workflow_run.id }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    path: ${{ runner.temp }}/build-failure-1.21.11/
                continue-on-error: true

            -   name: Download build failure artifact (26.1)
                id: download_2
                uses: actions/download-artifact@v8
                with:
                    name: build-failure-output-26.1
                    run-id: ${{ github.event.workflow_run.id }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    path: ${{ runner.temp }}/build-failure-26.1/
                continue-on-error: true

            -   name: Resolve PR number
                id: pr
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
                    HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
                    TARGET_REPO: ${{ github.repository }}
                run: |
                    PR_NUMBER=$(gh api --paginate "repos/$TARGET_REPO/pulls?state=open" \
                    | jq -s --arg repo "$HEAD_REPO" --arg branch "$HEAD_BRANCH" \
                    'add | map(select(.head.repo.full_name == $repo and .head.ref == $branch)) | .[0].number // empty')
                    echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            -   name: Check if commit is still current
                id: check_sha
                if: steps.pr.outputs.number != ''
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    CURRENT_SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}" --jq '.head.sha' 2>/dev/null || echo "")
                    if [ "$CURRENT_SHA" = "${{ github.event.workflow_run.head_sha }}" ]; then
                    echo "current=true" >> "$GITHUB_OUTPUT"
                    else
                    echo "Skipping: ${{ github.event.workflow_run.head_sha }} is no longer PR HEAD (current: $CURRENT_SHA)"
                    echo "current=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Cache Kotlin compiler
                uses: actions/cache@v6
                with:
                    path: ~/kotlinc
                    key: kotlin-2.4.0

            -   name: Set up Kotlin
                run: |
                    if [ ! -d "$HOME/kotlinc" ]; then
                        curl -sLO "https://github.com/JetBrains/kotlin/releases/download/v2.4.0/kotlin-compiler-2.4.0.zip"
                        unzip -q kotlin-compiler-2.4.0.zip -d "$HOME"
                    fi
                    echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

            -   name: Post build failure comment
                if: steps.pr.outputs.number != '' && steps.check_sha.outputs.current == 'true'
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GITHUB_REPOSITORY: ${{ github.repository }}
                    PR_NUMBER: ${{ steps.pr.outputs.number }}
                    ARTIFACT_DIR_1: ${{ runner.temp }}/build-failure-1.21.11
                    ARTIFACT_DIR_2: ${{ runner.temp }}/build-failure-26.1
                    WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
                    HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                    MODE: build
                run: kotlinc -script .github/scripts/pr_review.main.kts
