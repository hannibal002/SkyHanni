name: "PR Changelog Verification"

on:
    pull_request:
        types: [opened, edited, ready_for_review]

jobs:
    verify-changelog:
        if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        concurrency:
            group: verify-changelog-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - uses: ./.github/actions/setup-normal-workspace

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Run ChangeLog verification w/retry
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              uses: ./.github/actions/gradle-retry
              with:
                  gradle-command: checkPrDescription -PprTitle="${PR_TITLE}" -PprBody="${PR_BODY}"

            - name: Upload changelog errors on failure
              if: steps.run_check.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                  name: changelog-errors-${{ github.event.pull_request.number }}
                  path: versions/1.8.9/build/changelog_errors.txt
