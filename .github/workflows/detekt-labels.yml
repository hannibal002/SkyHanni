name: Detekt Labels

on:
    workflow_run:
        workflows: ["Detekt"]
        types:
            - completed

permissions:
    pull-requests: write

jobs:
    detekt_label:
        name: Label and Comment on PR
        runs-on: ubuntu-latest
        # Only run this job for pull requests that failed the detekt check
        if: >
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.pull_requests[0]

        steps:
            - name: Get PR info
              id: get_pr_info
              run: |
                  echo "PR_NUMBER=${{ github.event.workflow_run.pull_requests[0].number }}" >> $GITHUB_OUTPUT
                  echo "PR_SHA=${{ github.event.workflow_run.pull_requests[0].head.sha }}" >> $GITHUB_OUTPUT

            - name: Add label if detekt failed
              if: ${{ github.event.workflow_run.conclusion == 'failure' }}
              uses: actions-ecosystem/action-add-labels@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  number: ${{ steps.get_pr_info.outputs.PR_NUMBER }}
                  labels: "Detekt"

            - name: Remove label if detekt passed
              if: ${{ github.event.workflow_run.conclusion == 'success' }}
              uses: actions-ecosystem/action-remove-labels@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  number: ${{ steps.get_pr_info.outputs.PR_NUMBER }}
                  labels: "Detekt"

            - name: Download detekt output artifact
              if: ${{ github.event.workflow_run.conclusion == 'failure' }}
              uses: actions/download-artifact@v4
              with:
                  name: detekt-output
                  path: .

            - name: Checkout base repo to get trusted scripts
              if: ${{ github.event.workflow_run.conclusion == 'failure' }}
              uses: actions/checkout@v4

            - name: Process detekt output and create comment
              if: ${{ github.event.workflow_run.conclusion == 'failure' }}
              env:
                  PR_SHA: ${{ steps.get_pr_info.outputs.PR_SHA }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
              run: |
                  # Note: This runs the .kts script from YOUR repo, not the PR
                  kotlinc -script .github/scripts/process-detekt-output.kts

            - name: Check for duplicate comment
              if: ${{ github.event.workflow_run.conclusion == 'failure' }}
              id: check_duplicate
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      if (!fs.existsSync('detekt_comment.txt')) return false; // Artifact might not exist
                      const commentBody = fs.readFileSync('detekt_comment.txt', 'utf8');
                      const m = commentBody.match(//);
                      if (!m) return false;
                      const hash = m[1];
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo:  context.repo.repo,
                        issue_number: ${{ steps.get_pr_info.outputs.PR_NUMBER }}
                      });
                      return comments.some(c => c.body.includes(hash));

            - name: Add comment to PR
              if: ${{ github.event.workflow_run.conclusion == 'failure' && steps.check_duplicate.outputs.result != 'true' }}
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const commentBody = fs.readFileSync('detekt_comment.txt', 'utf8');
                      github.rest.issues.createComment({
                        issue_number: ${{ steps.get_pr_info.outputs.PR_NUMBER }},
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: commentBody
                      })
    remove_label:
        name: Remove Detekt Label
        runs-on: ubuntu-latest
        if: >
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.pull_requests[0]

        steps:
            - name: Get PR number
              id: get_pr
              run: echo "PR_NUMBER=${{ github.event.workflow_run.pull_requests[0].number }}" >> $GITHUB_OUTPUT

            - name: Remove 'Detekt' label
              uses: actions-ecosystem/action-remove-labels@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  number: ${{ steps.get_pr.outputs.PR_NUMBER }}
                  labels: "Detekt"
