name: Detekt Review

on:
    workflow_run:
        workflows: [ "Detekt" ]
        types: [ completed ]

permissions:
    pull-requests: write
    issues: write
    actions: read

jobs:
    review:
        name: Post Detekt review
        runs-on: ubuntu-latest
        if: github.event.workflow_run.event == 'pull_request'
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Download detekt artifact
                id: download
                uses: actions/download-artifact@v4
                with:
                    name: detekt-output
                    run-id: ${{ github.event.workflow_run.id }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    path: detekt-artifact/
                continue-on-error: true

            -   name: Cache Kotlin compiler
                uses: actions/cache@v4
                with:
                    path: ~/kotlinc
                    key: kotlin-2.0.21

            -   name: Set up Kotlin
                run: |
                    if [ ! -d "$HOME/kotlinc" ]; then
                        curl -sLO "https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip"
                        unzip -q kotlin-compiler-2.0.21.zip -d "$HOME"
                    fi
                    echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

            -   name: Post review and manage label
                if: steps.download.outcome == 'success'
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GITHUB_REPOSITORY: ${{ github.repository }}
                run: kotlinc -script .github/scripts/post_detekt_review.main.kts
