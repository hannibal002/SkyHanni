name: "Detekt Notify"

on:
    workflow_run:
        workflows: ["Detekt"]
        types: [completed]

permissions:
    pull-requests: write
    actions: read
    contents: read

jobs:
    notify:
        if: >
            github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.event == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout base repo
                uses: actions/checkout@v6
                with:
                    persist-credentials: false

            -   name: Download detekt artifact
                id: download
                uses: actions/github-script@v7
                with:
                    script: |
                        const arts = await github.rest.actions.listWorkflowRunArtifacts({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            run_id: context.payload.workflow_run.id,
                        });
                        const match = arts.data.artifacts.find(a => a.name === 'detekt-output');
                        if (!match) {
                            core.warning('No detekt-output artifact found — skipping');
                            return;
                        }
                        const dl = await github.rest.actions.downloadArtifact({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            artifact_id: match.id,
                            archive_format: 'zip',
                        });
                        require('fs').writeFileSync('artifact.zip', Buffer.from(dl.data));
                        core.setOutput('found', 'true');

            -   name: Unzip artifact
                if: steps.download.outputs.found == 'true'
                run: unzip -q artifact.zip -d artifact

            -   name: Validate head_sha and prepare workspace
                id: validate
                if: steps.download.outputs.found == 'true'
                uses: actions/github-script@v7
                with:
                    script: |
                        const fs = require('fs');
                        const prHeadSha = fs.readFileSync('artifact/pr_head_sha.txt', 'utf8').trim();

                        // Prevent a crafted artifact from targeting a different PR
                        if (prHeadSha !== context.payload.workflow_run.head_sha) {
                            core.setFailed(`head_sha mismatch: artifact=${prHeadSha} workflow_run=${context.payload.workflow_run.head_sha}`);
                            return;
                        }

                        fs.copyFileSync('artifact/detekt_output.txt', 'detekt_output.txt');
                        core.setOutput('pr_head_sha', prHeadSha);

            -   name: Generate detekt comment markdown
                if: steps.validate.outputs.pr_head_sha != ''
                env:
                    PR_SHA: ${{ steps.validate.outputs.pr_head_sha }}
                    GITHUB_REPOSITORY: ${{ github.repository }}
                run: kotlinc -script .github/scripts/process-detekt-output.kts

            -   name: Post comment on PR
                if: steps.validate.outputs.pr_head_sha != ''
                uses: actions/github-script@v7
                with:
                    script: |
                        const fs = require('fs');
                        if (!fs.existsSync('detekt_comment.txt')) {
                            core.warning('detekt_comment.txt not generated — skipping');
                            return;
                        }
                        const prNumber = parseInt(fs.readFileSync('artifact/pr_number.txt', 'utf8').trim(), 10);
                        if (!prNumber) { core.setFailed('Invalid PR number in artifact'); return; }

                        await github.rest.issues.createComment({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: prNumber,
                            body: fs.readFileSync('detekt_comment.txt', 'utf8'),
                        });
