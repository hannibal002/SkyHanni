name: Detekt

on:
    workflow_run:
        workflows: ["Build"]
        types: [completed]

permissions:
    contents: read
    pull-requests: write
    actions: read

jobs:
    detekt:
        name: Run detekt
        runs-on: ubuntu-latest
        if: |
            github.event.workflow_run.event == 'pull_request_target' &&
            github.event.workflow_run.conclusion == 'success'
        concurrency:
            group: detekt-${{ github.event.workflow_run.id }}
            cancel-in-progress: true
        permissions:
            contents: read
            pull-requests: write
            actions: read
        outputs:
            sarif_exists: ${{ steps.check_sarif.outputs.exists }}
            detekt_failed: ${{ steps.run_detekt.outcome == 'failure' || steps.run_detekt_fork.outcome == 'failure' }}
            pr_number: ${{ steps.pr_meta.outputs.number }}
            pr_sha: ${{ steps.pr_meta.outputs.sha }}
            pr_repo: ${{ steps.pr_meta.outputs.repo }}
            pr_draft: ${{ steps.pr_meta.outputs.draft }}
        steps:
            -   name: Download PR metadata
                uses: actions/download-artifact@v8
                with:
                    name: pr-metadata
                    run-id: ${{ github.event.workflow_run.id }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}

            -   name: Read PR metadata
                id: pr_meta
                run: |
                    echo "number=$(jq -r '.number' pr-metadata.json)" >> $GITHUB_OUTPUT
                    echo "sha=$(jq -r '.sha' pr-metadata.json)" >> $GITHUB_OUTPUT
                    echo "ref=$(jq -r '.ref' pr-metadata.json)" >> $GITHUB_OUTPUT
                    echo "repo=$(jq -r '.repo' pr-metadata.json)" >> $GITHUB_OUTPUT
                    echo "draft=$(jq -r '.draft' pr-metadata.json)" >> $GITHUB_OUTPUT

            -   name: Checkout PR code
                uses: actions/checkout@v6
                with:
                    ref: ${{ steps.pr_meta.outputs.ref }}
                    repository: ${{ steps.pr_meta.outputs.repo }}

            -   uses: hannibal002/SkyHanni/.github/actions/setup-normal-workspace@beta
                if: github.repository == 'hannibal002/SkyHanni'
            -   uses: ./.github/actions/setup-normal-workspace
                if: github.repository != 'hannibal002/SkyHanni'
            -   name: Disable preprocessor
                run: |
                    mkdir -p .gradle
                    echo skyhanni.multi-version=off > .gradle/private.properties
            -   name: Run detekt main (w/ typing analysis) w/gradle retry
                id: run_detekt
                if: github.repository == 'hannibal002/SkyHanni'
                uses: hannibal002/SkyHanni/.github/actions/gradle-retry@beta
                continue-on-error: true
                with:
                    gradle-command: detektMain --stacktrace
            -   name: Run detekt main (w/ typing analysis) w/gradle retry
                id: run_detekt_fork
                if: github.repository != 'hannibal002/SkyHanni'
                uses: ./.github/actions/gradle-retry
                continue-on-error: true
                with:
                    gradle-command: detektMain --stacktrace

            -   name: Check if SARIF file exists
                if: always()
                id: check_sarif
                run: |
                    if [ -f "build/reports/detekt/main.sarif" ]; then
                        echo "exists=true" >> $GITHUB_OUTPUT
                    else
                        echo "exists=false" >> $GITHUB_OUTPUT
                    fi

            -   name: Add label if detekt fails
                if: ${{ (steps.run_detekt.outcome == 'failure' || steps.run_detekt_fork.outcome == 'failure') && steps.check_sarif.outputs.exists == 'true' }}
                uses: actions/github-script@v7
                with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    script: |
                        await github.rest.issues.addLabels({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: ${{ steps.pr_meta.outputs.number }},
                            labels: ['Detekt']
                        });
            -   name: Remove label if detekt passes
                if: ${{ steps.run_detekt.outcome != 'failure' && steps.run_detekt_fork.outcome != 'failure' }}
                continue-on-error: true
                uses: actions/github-script@v7
                with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    script: |
                        await github.rest.issues.removeLabel({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: ${{ steps.pr_meta.outputs.number }},
                            name: 'Detekt'
                        }).catch(() => {});

            -   name: Annotate detekt failures
                if: ${{ !cancelled() && steps.check_sarif.outputs.exists == 'true' }}
                run: |
                    chmod +x .github/scripts/process_detekt_sarif.sh
                    ./.github/scripts/process_detekt_sarif.sh build/reports/detekt/main.sarif | tee detekt_output.txt
            -   name: Upload detekt output as artifact
                if: ${{ !cancelled() && steps.check_sarif.outputs.exists == 'true' }}
                uses: actions/upload-artifact@v7
                with:
                    name: detekt-output
                    path: detekt_output.txt

    detekt_comment:
        name: Comment detekt failures on PR
        runs-on: ubuntu-latest
        concurrency:
            group: detekt-comment-${{ needs.detekt.outputs.pr_number }}
            cancel-in-progress: true
        needs: detekt
        if: ${{
            needs.detekt.outputs.sarif_exists == 'true' &&
            needs.detekt.outputs.detekt_failed == 'true' &&
            needs.detekt.outputs.pr_draft == 'false'
            }}
        permissions:
            pull-requests: write
        steps:
            -   name: Checkout base repo code
                uses: actions/checkout@v6
                with:
                    ref: ${{ needs.detekt.outputs.pr_sha }}
                    repository: ${{ needs.detekt.outputs.pr_repo }}
            -   name: Download detekt output
                uses: actions/download-artifact@v8
                with:
                    name: detekt-output
                    path: .
            -   name: Process detekt output and create comment
                env:
                    PR_SHA: ${{ needs.detekt.outputs.pr_sha }}
                    GITHUB_REPOSITORY: ${{ github.repository }}
                run: |
                    kotlinc -script .github/scripts/process-detekt-output.kts
            -   name: Check for duplicate comment
                id: check_duplicate
                uses: actions/github-script@v7
                with:
                    script: |
                        const fs = require('fs');
                        const commentBody = fs.readFileSync('detekt_comment.txt', 'utf8');
                        const m = commentBody.match(/<!--\s*detekt-sarif-hash:(-?\d+)\s*-->/);
                        if (!m) return false;
                        const hash = m[1];
                        const { data: comments } = await github.rest.issues.listComments({
                            owner: context.repo.owner,
                            repo:  context.repo.repo,
                            issue_number: ${{ needs.detekt.outputs.pr_number }}
                        });
                        return comments.some(c => c.body.includes(hash));
            -   name: Skip comment if duplicate
                if: steps.check_duplicate.outputs.result == 'true'
                run: echo "Duplicate comment found, skipping..."

            -   name: Add comment to PR
                uses: actions/github-script@v7
                if: steps.check_duplicate.outputs.result != 'true'
                with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    script: |
                        const fs = require('fs');
                        const commentBody = fs.readFileSync('detekt_comment.txt', 'utf8');
                        github.rest.issues.createComment({
                            issue_number: ${{ needs.detekt.outputs.pr_number }},
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            body: commentBody
                        })

            -   name: Try to fail
                run: exit 1
