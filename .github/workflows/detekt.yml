# Execution context: PR branch code
name: Detekt

on:
    pull_request:
        types: [ opened, synchronize, reopened ]
        branches:
            - "**"
    workflow_dispatch: { }

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    detekt:
        name: Run detekt
        runs-on: ubuntu-latest
        concurrency:
            group: detekt-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        permissions:
            contents: read
        steps:
            -   name: Checkout PR code
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.event.pull_request.head.ref }}
                    repository: ${{ github.event.pull_request.head.repo.full_name }}

            -   uses: ./.github/actions/setup-normal-workspace
            -   name: Run detekt main (w/ typing analysis) w/gradle retry
                id: run_detekt
                uses: ./.github/actions/gradle-retry
                continue-on-error: true
                with:
                    gradle-command: :26.3:detektMain --stacktrace

            -   name: Check if SARIF file exists
                if: always()
                id: check_sarif
                run: |
                    if [ -f "build/reports/detekt/main.sarif" ]; then
                        echo "exists=true" >> $GITHUB_OUTPUT
                    else
                        echo "exists=false" >> $GITHUB_OUTPUT
                    fi

            -   name: Save detekt artifact
                if: ${{ !cancelled() }}
                run: |
                    mkdir -p detekt-artifact
                    if [ -f "build/reports/detekt/main.sarif" ]; then
                        cp build/reports/detekt/main.sarif detekt-artifact/main.sarif
                    fi
                    if [ "${{ steps.run_detekt.outcome }}" == "failure" ]; then
                        cp "$GITHUB_WORKSPACE/gradle-output.log" detekt-artifact/detekt-run.log 2>/dev/null || true
                    fi

            -   name: Annotate detekt failures
                if: ${{ !cancelled() && steps.check_sarif.outputs.exists == 'true' }}
                run: |
                    chmod +x .github/scripts/process_detekt_sarif.sh
                    ./.github/scripts/process_detekt_sarif.sh build/reports/detekt/main.sarif | tee detekt_output.txt
            -   name: Upload detekt artifact
                if: ${{ !cancelled() }}
                uses: actions/upload-artifact@v7
                with:
                    name: detekt-output
                    path: detekt-artifact/
            -   name: Fail job if detekt found issues
                if: steps.run_detekt.outcome == 'failure'
                run: exit 1
