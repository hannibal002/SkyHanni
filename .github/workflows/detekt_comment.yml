name: Comment detekt failures on PR

on:
    workflow_run:
        workflows: ["Build"]
        types: [completed]

permissions:
    contents: read
    pull-requests: write
    actions: read

jobs:
    detekt_comment:
        name: Comment detekt failures on PR
        runs-on: ubuntu-latest
        if: github.event.workflow_run.event == 'pull_request_target'
        concurrency:
            group: detekt-comment-${{ github.event.workflow_run.id }}
            cancel-in-progress: true
        steps:
            -   name: Download detekt output
                id: download_detekt
                continue-on-error: true
                uses: actions/download-artifact@v8
                with:
                    name: detekt-output
                    run-id: ${{ github.event.workflow_run.id }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}

            -   name: Download PR metadata
                if: steps.download_detekt.outcome == 'success'
                uses: actions/download-artifact@v8
                with:
                    name: pr-metadata
                    run-id: ${{ github.event.workflow_run.id }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}

            -   name: Read PR metadata
                id: pr_meta
                if: steps.download_detekt.outcome == 'success'
                run: |
                    echo "number=$(jq -r '.number' pr-metadata.json)" >> $GITHUB_OUTPUT
                    echo "sha=$(jq -r '.sha' pr-metadata.json)" >> $GITHUB_OUTPUT
                    echo "repo=$(jq -r '.repo' pr-metadata.json)" >> $GITHUB_OUTPUT
                    echo "draft=$(jq -r '.draft' pr-metadata.json)" >> $GITHUB_OUTPUT

            -   name: Checkout base repo code
                if: steps.download_detekt.outcome == 'success' && steps.pr_meta.outputs.draft == 'false'
                uses: actions/checkout@v6
                with:
                    ref: ${{ steps.pr_meta.outputs.sha }}
                    repository: ${{ steps.pr_meta.outputs.repo }}

            -   name: Process detekt output and create comment
                if: steps.download_detekt.outcome == 'success' && steps.pr_meta.outputs.draft == 'false'
                env:
                    PR_SHA: ${{ steps.pr_meta.outputs.sha }}
                    GITHUB_REPOSITORY: ${{ github.repository }}
                run: |
                    kotlinc -script .github/scripts/process-detekt-output.kts

            -   name: Check for duplicate comment
                id: check_duplicate
                if: steps.download_detekt.outcome == 'success' && steps.pr_meta.outputs.draft == 'false'
                uses: actions/github-script@v7
                with:
                    script: |
                        const fs = require('fs');
                        const commentBody = fs.readFileSync('detekt_comment.txt', 'utf8');
                        const m = commentBody.match(/<!--\s*detekt-sarif-hash:(-?\d+)\s*-->/);
                        if (!m) return false;
                        const hash = m[1];
                        const { data: comments } = await github.rest.issues.listComments({
                            owner: context.repo.owner,
                            repo:  context.repo.repo,
                            issue_number: ${{ steps.pr_meta.outputs.number }}
                        });
                        return comments.some(c => c.body.includes(hash));

            -   name: Add comment to PR
                if: steps.download_detekt.outcome == 'success' && steps.pr_meta.outputs.draft == 'false' && steps.check_duplicate.outputs.result != 'true'
                uses: actions/github-script@v7
                with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    script: |
                        const fs = require('fs');
                        const commentBody = fs.readFileSync('detekt_comment.txt', 'utf8');
                        github.rest.issues.createComment({
                            issue_number: ${{ steps.pr_meta.outputs.number }},
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            body: commentBody
                        })
