config:
    validation: true
    # UnusedPrivateMember is the detekt 1.x name of UnusedPrivateFunction. detekt 2.x does not know the key,
    # but the bundled detekt of the IntelliJ plugin still does. Excluded from validation so one config works for both.
    excludes:
        - '.*>UnusedPrivateMember.*'

GrammarRules:
    AvoidBritishSpelling:
        active: true

CompatRules:
    MinecraftCompat:
        active: true
    VanillaItemStackImport:
        active: true

FormattingRules:
    CustomCommentSpacing:
        active: false
    CustomAnnotationSpacing:
        active: true
    StorageVarOrVal:
        active: true

RepoRules:
    SkullTexturesUseRepo:
        active: true
    RepoPatternRegexTestMissing:
        active: true
    RepoPatternRegexTestFailed:
        active: true
    RepoPatternUnnamedGroup:
        active: true
    RepoPatternPassesShapeRequirement:
        active: true

ImportRules:
    CustomImportOrdering:
        active: true

SkyHanniStyle:
    InSkyBlockEarlyReturn:
        active: true
    IsInIslandEarlyReturn:
        active: true
    OnlyOnIslandSpecificity:
        active: true
    PrivateEventListener:
        active: true
    PrivateUseUnicodeRule:
        active: true

style:
    MagicNumber: # I, Linnea Gräf, of sound mind and body, disagree with disabling this rule
        active: false
    UnusedParameter:
        active: true
        ignoreAnnotated:
            - 'SubscribeEvent'
            - 'HandleEvent'
            - 'Mod.EventHandler'
    ReturnCount:
        active: true
        max: 5
        excludeGuardClauses: true
        ignoreAnnotated:
            - 'SubscribeEvent'
            - 'HandleEvent'
            - 'Mod.EventHandler'
    MaxLineLength:
        active: true
        maxLineLength: 140
        excludeCommentStatements: true
    LoopWithTooManyJumpStatements:
        active: true
        maxJumpCount: 3
    UnusedPrivateClass: # seldom intentional
        active: false
    UnusedPrivateFunction: # gets tripped up by API methods
        active: false
    UnusedPrivateMember: # detekt 1.x name of UnusedPrivateFunction, only read by the IntelliJ detekt plugin
        active: false
    UnusedPrivateProperty: # loops that don't use their iterator
        active: true
        allowedNames: "^(unused|_)$"
    UseCheckOrError:
        active: false
    ForbiddenComment: # every TODO gets flagged
        active: false
    DestructuringDeclarationWithTooManyEntries: # too aggressive
        active: true
        maxDestructuringEntries: 5
    AbstractClassCanBeConcreteClass: # this is usually intentional
        active: false

ktlint:
    MaximumLineLength: # ktlint - handled by detekt
        active: false
    MultiLineIfElse:
        active: false
    ArgumentListWrapping: # ktlint - way too aggressive
        active: false
    NoBlankLineBeforeRbrace: # pedantic
        active: false
    NoConsecutiveBlankLines: # pedantic
        active: false
    NoEmptyFirstLineInMethodBlock: # pedantic
        active: false
    ParameterListWrapping: # pedantic, can be useful in compact code
        active: false
    CommentSpacing: # handled by custom rule
        active: false
    SpacingBetweenDeclarationsWithAnnotations: # nah
        active: false
    SpacingBetweenDeclarationsWithComments: # also nah
        active: false
    ImportOrdering: # handled by custom rule
        active: false
    AnnotationSpacing: # handled by custom rule
        active: false
    FunctionReturnTypeSpacing:
        maxLineLength: 140
    ParameterWrapping:
        maxLineLength: 140
    PropertyWrapping:
        maxLineLength: 140
    Wrapping:
        maxLineLength: 140
    BlockCommentInitialStarAlignment:
        active: false
    CommentWrapping:
        active: false
    BinaryExpressionWrapping: # TODO maybe re-evaluate in the future
        active: false
    BlankLineBetweenWhenConditions:
        active: false
    ClassSignature:
        active: false
    FunctionExpressionBody:
        active: false
    FunctionLiteral:
        active: false
    FunctionSignature:
        active: false
    MixedConditionOperators:
        active: false
    TrailingCommaOnCallSite:
        active: false

complexity:
    CyclomaticComplexMethod: # default allowedComplexity of 14, caught almost every complex method
        active: true
        allowedComplexity: 25
    LongParameterList: # too aggressive, classes can need a lot of params
        active: false
    NestedBlockDepth: # too aggressive
        active: false
    TooManyFunctions: # too aggressive by default (11 on all file types)
        active: true
        allowedFunctionsPerFile: 15
        allowedFunctionsPerClass: 20
        allowedFunctionsPerInterface: 20
        allowedFunctionsPerObject: 20
        allowedFunctionsPerEnum: 11
        ignoreAnnotated:
            - 'SkyHanniModule'
    ComplexCondition: # aggressive by default, at a complexity of 3
        active: true
        allowedConditions: 6
    LongMethod: # default max length of 60, caught way too much
        active: true
        allowedLines: 100

exceptions:
    SwallowedException: # there are valid reasons to do this
        active: false
    ThrowingExceptionsWithoutMessageOrCause: # again, valid reasons
        active: false
    TooGenericExceptionCaught: # sometimes you just need to catch Exception
        active: false
    TooGenericExceptionThrown: # we don't have our own custom exceptions
        active: false

naming:
    ConstructorParameterNaming: # pedantic
        active: false

potential-bugs:
    DoubleMutabilityForCollection: # went crazy about all the mutable collections
        active: false
    HasPlatformType: # false positives on config get() methods
        active: false
    StorageNeedsExpose:
        active: true
    NonStorageDoesntNeedExpose:
        active: true
    ImmutableTypesWithExpectedInteriorMutabilityInConfig:
        active: true
    UnreachableCode:
        active: false
    IgnoredReturnValue:
        active: true
        ignoreFunctionCall:
            - 'java.util.concurrent.ConcurrentHashMap.put'
            - 'java.util.concurrent.ConcurrentHashMap.remove'
            - 'kotlin.collections.MutableMap.put'
            - 'kotlin.collections.MutableMap.remove'
